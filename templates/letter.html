<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[TITLE]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --fs: 9.5pt;          /* body size  — the toolbar changes this */
  --gap: 2px;          /* space between entries — the toolbar changes this */
  --accent: #2b4c8c;
  --ink: #111;
  --rule: #9aa3b0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#525659}
body{font-family:Lato,"Segoe UI",Arial,sans-serif;color:var(--ink)}

/* ---------- the sheet ---------- */
.page{
  width:210mm; min-height:297mm; margin:18px auto; padding:12mm 14mm;
  background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.45);
  font-size:var(--fs); line-height:1.22;
}

/* ---------- header ---------- */
.head{display:flex; align-items:center; gap:14px}
/* Photo is public, in assets/photo.jpg (Gaurav's call, 30 Oct 2026). render.cmd embeds it so the PDF carries it. */
.photo{width:22mm; height:28mm; object-fit:cover; border:1px solid var(--rule); flex:0 0 auto}
h1{font-size:2.45em; line-height:1; margin:0 0 2px; letter-spacing:-.5px}
.links{font-size:.95em}
.links a{color:var(--ink); text-decoration:underline; text-underline-offset:2px}
.contact{font-size:.95em; line-height:1.45; margin:1px 0 0}
.contact a{color:var(--ink); text-decoration:none}

/* ---------- sections ---------- */
h2{
  font-variant:small-caps; font-weight:700; letter-spacing:.4px;
  color:var(--accent); font-size:1.12em; margin:calc(var(--gap) + 5px) 0 1px;
  border-bottom:1px solid var(--rule); padding-bottom:2px;
}
h2:first-of-type{margin-top:calc(var(--gap) + 2px)}
p{margin:3px 0}

/* ---------- skills grid ---------- */
.skills{display:grid; grid-template-columns:max-content 1fr; column-gap:10px; row-gap:1px; margin:3px 0 0}
.skills dt{font-weight:700}
.skills dd{margin:0}
.skills dt::after{content:""}

/* ---------- experience / project entries ---------- */
.entry{margin-top:var(--gap)}
.row{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.row .r{white-space:nowrap}
.t{font-weight:700}
.sub{font-style:italic}
ul{margin:0; padding-left:14px}
li{margin:0}

/* project header: name | stack | link */
.prow{display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; gap:10px}
.prow .pname{font-weight:700; text-decoration:underline; text-underline-offset:2px}
.prow .pstack{font-style:italic; text-align:center}
.prow .plink{text-align:right}
.prow .plink a{color:var(--ink); text-decoration:underline; text-underline-offset:2px}


/* ---------- print ---------- */
@page{size:A4; margin:12mm 14mm}
@media print{
  html,body{background:#fff; padding:0}
  .page{width:auto; min-height:0; margin:0; padding:0; box-shadow:none}
  a{color:var(--ink) !important}
  h2{break-after:avoid}
  .entry{break-inside:avoid}
}

/* ---------- letter ---------- */
.page{font-size:10.5pt; line-height:1.45}
.head{padding-bottom:6px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.meta{display:flex; justify-content:space-between; margin:0 0 14px}
.body p{margin:0 0 9px}
.sign{margin-top:14px}
</style>
</head>
<body>
<!-- Cover letter, one page. Same header as the CV. Filled by scripts/build_letter.py from
     out/Gaurav_Bhatia_Letter_<Company>.md, which is the text check.py checks. Do not edit wording here. -->
<div class="page">

  <div class="head">
    <img class="photo" src="../assets/photo.jpg" alt="Gaurav Bhatia">
    <div class="id">
      <h1>Gaurav Bhatia</h1>
      <div class="contact">Berlin, Germany | [EMAIL] | [PHONE]</div>
      <div class="links">
        <a href="https://gauravbhatia-bit.github.io/">Portfolio</a> |
        <a href="https://github.com/gauravbhatia-bit">GitHub</a> |
        <a href="https://www.linkedin.com/in/gauravbhatia-bit/">LinkedIn</a>
      </div>
    </div>
  </div>

  <div class="meta"><span>[RECIPIENT]</span><span>Berlin, [DATE]</span></div>

  <div class="body">
[LETTER_BODY]
  </div>

</div>
</body>
</html>
